name: Build VCV Plugin

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README*'
      - 'CHANGELOG*'
      - 'doc/**'
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: lin
            sdk: lin-x64
          - os: macos-latest
            platform: mac-x64
            sdk: mac-x64
            target: x86_64-apple-darwin
          - os: macos-latest
            platform: mac-arm64
            sdk: mac-arm64
            target: arm64-apple-darwin
          - os: windows-latest
            platform: win
            sdk: win-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up environment (Linux)
        if: matrix.platform == 'lin'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa-dev libxi-dev

      - name: Download Rack SDK
        shell: bash
        run: |
          RACK_VERSION="2.6.6"
          curl -fL -O "https://vcvrack.com/downloads/Rack-SDK-${RACK_VERSION}-${{ matrix.sdk }}.zip"
          unzip -q "Rack-SDK-${RACK_VERSION}-${{ matrix.sdk }}.zip" -d ..

      - name: Build plugin
        shell: bash
        run: |
          export RACK_DIR="../Rack-SDK"
          if [ -n "${{ matrix.target }}" ]; then
            export CROSS_COMPILE="${{ matrix.target }}-"
          fi
          make dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.platform }}
          path: dist/*.vcvplugin

  publish:
    name: Publish Release Assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: _artifacts/**/*.vcvplugin
          tag: ${{ github.ref }}
          file_glob: true
