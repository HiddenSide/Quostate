name: Build VCV Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: lin
            sdk: lin-x64
          - os: macos-latest
            platform: mac-x64
            sdk: mac-x64
          - os: macos-latest
            platform: mac-arm64
            sdk: mac-arm64
          - os: windows-latest
            platform: win
            sdk: win-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment (Linux)
        if: matrix.platform == 'lin'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa-dev libxi-dev

      - name: Download Rack SDK
        shell: bash
        run: |
          RACK_VERSION="2.6.6"
          curl -fL -O "https://vcvrack.com/downloads/Rack-SDK-${RACK_VERSION}-${{ matrix.sdk }}.zip"
          unzip -q "Rack-SDK-${RACK_VERSION}-${{ matrix.sdk }}.zip" -d ..

      - name: Build plugin
        shell: bash
        run: |
          export RACK_DIR="../Rack-SDK"
          if [ "${{ matrix.platform }}" == "mac-x64" ]; then
            arch -x86_64 make dist
          else
            make dist
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.platform }}
          path: dist/*.vcvplugin
